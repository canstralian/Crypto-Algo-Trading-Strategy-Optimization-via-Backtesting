# Example Configuration File
# Copy this to config.yaml and customize for your needs

# Application Settings
app:
  name: "Crypto Trading Platform"
  version: "1.0.0"
  environment: "development"  # development, staging, production
  debug: true

# Exchange Configuration
exchange:
  name: "binance"  # binance, coinbase, kraken, etc.
  sandbox: true  # Use testnet/sandbox for testing
  rate_limit: true
  timeout: 30000
  enable_rate_limit: true

# Backtesting Configuration
backtesting:
  initial_capital: 10000.0
  commission: 0.001  # 0.1%
  slippage: 0.0005   # 0.05%
  default_timeframe: "1h"
  default_symbol: "BTC/USDT"

# Risk Management
risk_management:
  max_position_size: 0.1  # 10% of portfolio per trade
  max_portfolio_risk: 0.02  # 2% max risk per trade
  stop_loss_percentage: 0.02  # 2% stop loss
  take_profit_percentage: 0.05  # 5% take profit
  max_open_positions: 5
  min_trade_size: 10.0  # Minimum trade size in quote currency
  max_leverage: 1.0  # No leverage by default

# Strategy Defaults
strategies:
  moving_average:
    short_period: 10
    long_period: 30

  rsi:
    period: 14
    overbought: 70
    oversold: 30

  macd:
    fast_period: 12
    slow_period: 26
    signal_period: 9

  bollinger_bands:
    period: 20
    std_dev: 2

  multi_strategy:
    strategies:
      - name: "ma_crossover"
        weight: 0.4
      - name: "rsi"
        weight: 0.3
      - name: "macd"
        weight: 0.3
    min_agreement: 0.6  # Require 60% agreement to trade

# Data Configuration
data:
  storage_path: "./data"
  cache_enabled: true
  cache_ttl: 3600  # 1 hour
  default_limit: 1000  # Default number of candles to fetch
  validate_data: true
  fill_missing: true

# Database
database:
  url: "sqlite:///./data/trading.db"
  echo: false
  pool_size: 5
  max_overflow: 10

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  rate_limit:
    per_minute: 60
    per_hour: 1000
  authentication:
    enabled: true
    api_key_header: "X-API-Key"

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "json"  # json or text
  output: "file"  # console, file, or both
  file_path: "./logs/trading.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Monitoring & Alerting
monitoring:
  enabled: true
  metrics_interval: 60  # seconds
  health_check_interval: 30  # seconds

# Performance Optimization
performance:
  use_numba: false
  use_multiprocessing: false
  max_workers: 4
  chunk_size: 1000

# Feature Flags
features:
  enable_live_trading: false
  enable_paper_trading: true
  enable_optimization: true
  enable_walk_forward: true
  enable_monte_carlo: true
