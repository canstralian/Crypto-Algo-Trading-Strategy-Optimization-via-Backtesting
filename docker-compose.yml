version: '3.8'

services:
  trading-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-trading-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
      - ./config:/app/config:ro
    restart: unless-stopped
    networks:
      - trading-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL database (uncomment if needed)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: trading-postgres
  #   environment:
  #     POSTGRES_DB: trading_db
  #     POSTGRES_USER: trader
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - trading-network
  #   restart: unless-stopped

  # Optional: Redis cache (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: trading-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - trading-network
  #   restart: unless-stopped

networks:
  trading-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
